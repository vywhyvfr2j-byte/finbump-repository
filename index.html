    <!-- Branded launch screen — replaced when React mounts -->
    <style>
      #finbump-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #FAF6F0;
        z-index: 9999;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .finbump-splash-logo {
        width: 82px;
        height: 82px;
        object-fit: cover;
        border-radius: 15px;
        animation: finbump-bob 3.2s ease-in-out infinite;
      }
      .finbump-splash-wordmark {
        margin-top: 14px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 30px;
        font-weight: 600;
        color: #3D2B2B;
        letter-spacing: -0.02em;
      }
      .finbump-splash-tagline {
        margin-top: 4px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 12px;
        color: #9A8B7A;
        letter-spacing: 0.04em;
      }
      /* Dark mode launch screen: without this the splash stays warm-cream and
         flashes bright white before a dark-themed app paints. */
      @media (prefers-color-scheme: dark) {
        #finbump-splash { background: #09090b; }
        .finbump-splash-wordmark { color: #f4f4f5; }
        .finbump-splash-tagline { color: #a1a1aa; }
      }
      .finbump-splash-loader {
        display: flex;
        gap: 6px;
        margin-top: 28px;
      }
      .finbump-splash-loader span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #E87878;
        animation: finbump-dot 1.4s ease-in-out infinite;
      }
      .finbump-splash-loader span:nth-child(2) { animation-delay: 0.18s; background: #FDD062; }
      .finbump-splash-loader span:nth-child(3) { animation-delay: 0.36s; background: #1D7A78; }
      @keyframes finbump-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes finbump-dot {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.7); }
        40% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .finbump-splash-logo, .finbump-splash-loader span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- FinBump launch screen — replaced when React mounts -->
      <div id="finbump-splash">
        <img class="finbump-splash-logo" src="https://media.base44.com/images/public/6a51288bdcecc77c014539fd/56b61e622_apple-touch-icon-180.png" alt="FinBump" />
        <span class="finbump-splash-wordmark">FinBump</span>
        <span class="finbump-splash-tagline">never forget to show up</span>
        <div class="finbump-splash-loader">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
