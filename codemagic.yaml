workflows:
  finbump-web:
    name: FinBump Web Build
    max_build_duration: 30
    instance_type: mac_mini_m2

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build FinBump
        script: |
          npm run build

    artifacts:
      - dist/**

  finbump-ios:
    name: FinBump iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: FinBump Build Upload

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.finbump.app
      node: latest
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build FinBump web app
        script: |
          npm run build

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Apply iOS signing profile
        script: |
          xcode-project use-profiles

      - name: Build signed FinBump IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration